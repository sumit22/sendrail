name: Release

# Publishes to npm when a version tag is pushed:
#
#   npm version minor        # bumps package.json, commits, tags
#   git push --follow-tags
#
# Publishing from CI rather than a laptop buys two things: the tarball is built
# from exactly what is on the tag, and `--provenance` attaches a signed
# attestation linking the published package to this workflow run and commit.
# npm shows it as a "Built and signed on GitHub Actions" badge.
#
# Requires one repository secret: NPM_TOKEN, an npm granular access token with
# write access to the `sendrail` package.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for --provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # The same gates CI runs. prepublishOnly would run most of these anyway,
      # but running them explicitly means a failure names the step.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Are the types wrong?
        run: pnpm attw

      - name: Install smoke test
        run: pnpm check:install

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing version $PKG"

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        # prepublishOnly is skipped deliberately — every gate it runs has already
        # run above, and running them twice doubles a release's wall time.
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
